<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수학착착 캐릭터 포즈</title>
  <style>
    :root { --navy:#172033; --blue:#2f5bff; --line:#dfe6f2; --paper:#fff; --bg:#f3f6fb; --muted:#66728a; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif; color:var(--navy); background:var(--bg); }
    header { position:sticky; top:0; z-index:2; padding:18px 26px; color:#fff; background:linear-gradient(115deg,#13224b,#2f5bff); box-shadow:0 8px 24px #1720332b; }
    h1 { margin:0 0 5px; font-size:23px; } header p { margin:0; opacity:.85; font-size:13px; }
    main { max-width:1500px; margin:auto; padding:22px; }
    section { margin-bottom:28px; }
    section h2 { margin:0 0 12px; font-size:21px; }
    .grid { display:grid; grid-template-columns:repeat(4,minmax(180px,1fr)); gap:14px; }
    article { overflow:hidden; border:1px solid var(--line); border-radius:16px; background:#fff; box-shadow:0 7px 22px #25395f0d; }
    .sprite { aspect-ratio:1; display:grid; place-items:center; background-color:#fff; background-image:linear-gradient(45deg,#e6ebf4 25%,transparent 25%),linear-gradient(-45deg,#e6ebf4 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e6ebf4 75%),linear-gradient(-45deg,transparent 75%,#e6ebf4 75%); background-size:28px 28px; background-position:0 0,0 14px,14px -14px,-14px 0; }
    .sprite img { display:block; width:100%; height:100%; object-fit:contain; image-rendering:auto; }
    @media (max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media (max-width:560px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><h1>수학착착 캐릭터 포즈</h1><p>학습 흐름에 맞춰 반응하는 착착이와 공식이</p></header>
  <main>
    <section><h2>착착이</h2><div id="chakchaki" class="grid"></div></section>
    <section><h2>공식이</h2><div id="gongsickyi" class="grid"></div></section>
  </main>
  <script>
    const poses=[['p01','idle-listen','차분히 듣는 모습'],['p02','welcome','반갑게 인사하는 모습'],['p03','guide','방향을 안내하는 모습'],['p04','think','생각하는 모습'],['p05','praise-progress','칭찬하는 모습'],['p06','search','찾아보는 모습'],['p07','celebrate','축하하는 모습'],['p08','retry','다시 도전하도록 응원하는 모습']];
    const root='/outputs/019fcaf2-285c-7dc3-897a-3c9a2903aac4/2d-pet/v1.0/poses/png';
    function render(target,character){const slug=character.toLowerCase();document.getElementById(target).innerHTML=poses.map(([id,name,label])=>`<article><div class="sprite"><img src="${root}/${character}/${slug}_${id}_${name}_v1.0.png" alt="${character} ${label}"></div></article>`).join('');}
    render('chakchaki','Chakchaki'); render('gongsickyi','Gongsickyi');
  </script>
</body>
</html>
