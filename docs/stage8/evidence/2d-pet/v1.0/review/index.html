<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수학착착 캐릭터 컨셉아트</title>
  <style>
    :root { color-scheme: light; --navy:#172033; --blue:#2f5bff; --line:#dfe6f2; --paper:#fff; --bg:#f4f7fb; --muted:#63708a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, Pretendard, "Noto Sans KR", system-ui, sans-serif; color:var(--navy); background:var(--bg); }
    header { position:sticky; top:0; z-index:2; padding:20px 28px; color:white; background:linear-gradient(115deg,#13224b,#2f5bff); box-shadow:0 8px 28px #17203324; }
    header h1 { margin:0 0 6px; font-size:24px; }
    header p { margin:0; opacity:.85; font-size:14px; }
    main { max-width:1500px; margin:0 auto; padding:24px; }
    section { margin:0 0 28px; padding:22px; border:1px solid var(--line); border-radius:20px; background:var(--paper); box-shadow:0 10px 32px #263c6b0c; }
    section h2 { margin:0 0 6px; font-size:22px; }
    section > p { margin:0 0 18px; color:var(--muted); font-size:14px; }
    .compare { display:grid; grid-template-columns:minmax(320px, .75fr) minmax(480px, 1.25fr); gap:18px; align-items:start; }
    figure { margin:0; overflow:hidden; border:1px solid var(--line); border-radius:14px; background:#f8faff; }
    figcaption { padding:11px 14px; border-bottom:1px solid var(--line); font-size:13px; font-weight:800; background:white; }
    img { display:block; width:100%; height:auto; background:#f5f7fb; }
    @media (max-width:900px) { .compare { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>수학착착 캐릭터 컨셉아트</h1>
    <p>착착이와 공식이의 다양한 표정과 학습 포즈</p>
  </header>
  <main>
    <section>
      <h2>착착이</h2>
      <p>파란 S 모자, 짙은 갈색 머리, 큰 갈색 눈, 흰 후드, 파란 반바지·배낭·운동화를 확인합니다.</p>
      <div class="compare">
        <figure><figcaption>기본 모습</figcaption><img src="../../../../../../ssot/stage7/v1.0/Chakchaki_Approved_Reference_v1.0.png" alt="착착이 기본 모습"></figure>
        <figure><figcaption>학습 포즈</figcaption><img src="Chakchaki_Shaded2D_PoseSheet_Candidate_v1.0.png" alt="착착이 학습 포즈"></figure>
      </div>
    </section>

    <section>
      <h2>공식이</h2>
      <p>둥근 노란 몸체, 큰 갈색 눈, 남색 원형 안경·학사모, 짧은 갈색 발과 별 지시봉을 확인합니다.</p>
      <div class="compare">
        <figure><figcaption>기본 모습</figcaption><img src="../../../../../../ssot/stage7/v1.0/Gongsickyi_Approved_Reference_v1.0.png" alt="공식이 기본 모습"></figure>
        <figure><figcaption>학습 포즈</figcaption><img src="Gongsickyi_Shaded2D_PoseSheet_Candidate_v1.0.png" alt="공식이 학습 포즈"></figure>
      </div>
    </section>

  </main>
</body>
</html>
