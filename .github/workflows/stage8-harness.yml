name: Stage 8 Harness

on:
  push:
    branches: [main, "codex/**", "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate evidence-gated harness
        run: python scripts/harness/validate_harness.py
