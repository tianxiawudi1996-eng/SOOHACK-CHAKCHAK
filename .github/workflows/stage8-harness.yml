name: Stage 8 Harness

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main, "agent/stage8-harness"]

permissions:
  contents: read

jobs:
  validate-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate gate order and evidence
        run: python scripts/harness/validate_harness.py
      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'JSON_PASS {path}')
          PY
      - name: Test MVP vertical slice contracts
        run: python -m unittest discover -s tests -v
      - name: Smoke test static learning slice
        run: |
          python scripts/serve.py --port 4173 > /tmp/mathchackchack-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:4173/apps/web/ > /tmp/index.html
          curl --fail --silent --show-error http://127.0.0.1:4173/apps/web/data/unit-equation-basics.json > /tmp/unit.json
          test -s /tmp/index.html
          test -s /tmp/unit.json
          echo "VERTICAL_SLICE_SMOKE_PASS"
      - name: Reject forbidden completion claims
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = [
              '8단계 완료·배포 성공',
              'Gate 2 — Base Mesh: VERIFIED',
              'Production: VERIFIED',
          ]
          checked = [Path('harness'), Path('docs/stage8')]
          for root in checked:
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix in {'.md', '.json', '.yml', '.yaml'}:
                      text = path.read_text(encoding='utf-8')
                      for phrase in forbidden:
                          if phrase in text:
                              raise SystemExit(f'FORBIDDEN_CLAIM {phrase!r} in {path}')
          print('CLAIM_GUARD_PASS')
          PY
